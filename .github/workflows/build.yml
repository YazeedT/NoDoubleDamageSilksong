name: Build DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build project
        run: dotnet build NoDoubleDamage.sln --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: NoDoubleDamage
          path: '**/bin/Release/**/*.dll'
